spring:
  kafka:
    topics:
      ccs.sim-status.changed: ccs.sim-status.changed
      vmd.vehicle-part-binding.changed: vmd.vehicle-part-binding.changed
    consumer:
      group-id: tsp-vehicle-sim-status
      reactive-concurrency: 3

tsp:
  # VIAM 安全投影消费（IOV-TSP-DSN-CR-016）：默认关闭，旧 TSP 安全写链停用（联合切换）后启用。
  # 事件仅作触发/事实更新，安全状态以 VIAM 官方快照为准；Inbox 仅存契约摘要，不存敏感 payload。
  viam-projection:
    enabled: ${TSP_VIAM_PROJECTION_ENABLED:true}
    consumer:
      group-id: iov-tsp-viam-projection
      topics:
        login-succeeded: ${VIAM_KAFKA_TOPIC_DEVICE_LOGIN_SUCCEEDED:viam.device.login-succeeded}
        onboarding-changed: ${VIAM_KAFKA_TOPIC_DEVICE_ONBOARDING_CHANGED:viam.device.onboarding.changed}
        access-invalidated: ${VIAM_KAFKA_TOPIC_ACCESS_INVALIDATED:viam.access-invalidated}
        v2c-key-provisioned: ${VIAM_KAFKA_TOPIC_TBOX_V2C_KEY_PROVISIONED:viam.tbox-v2c-key-provisioned}
      retry:
        max-attempts: 5
        initial-backoff: 1s
        max-backoff: 30s
    snapshot:
      # VIAM 官方 onboarding 快照刷新（fail-closed：失败标记 STALE，不伪装状态）
      enabled: true
      max-attempts: 3
      initial-backoff: 1s
      max-backoff: 10s
  kafka:
    # 旧 vagw-tbox-event 链路默认关闭；CMD_ACK/FIND_VEHICLE 待 TSP-CR-011 恢复
    legacy-tbox-event:
      enabled: false
      topic: vagw-tbox-event
  tbox-management:
    # TBOX 后台运营查询（MPT，TSP-DSN-CR-009）：仅影响异常标签派生与查询/导出边界
    activation-timeout: PT30M
    long-offline-threshold: P30D
    export-max-rows: 10000
    default-page-size: 20
    max-page-size: 200

mybatis-plus:
  type-aliases-package: net.hwyz.iov.cloud.iov.tsp.service.infrastructure.persistence.po
