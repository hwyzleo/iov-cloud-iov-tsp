# TSP-DSN-CR-013：JSON java.time 时间契约（兼容阶段）
# 使用 FW-WEB iov.web.jackson.*（FW-WEB-DSN-CR-001）：
#   date-format=epoch-millis：修复版本，保持存量毫秒数字输出（不输出数组/秒小数）；
#   双读始终生效（ISO 字符串 + 10 位秒 + 13 位毫秒）；ISO 输出留待消费方就绪后切换（TSP-DSN-CR-013 §6/§7.3）。
# zone-id=UTC（TSP-DSN-CR-014 联动）：LocalDateTime 的 epoch 数字输出按该 zone 解释；
#   DB 时间墙钟已随 CR-014 改为显式 UTC（登录/激活/Inbox/投影来源），JVM/探针要求 UTC，
#   故 JSON 解释 zone 必须为 UTC，否则输出偏移 8 小时。历史存量（旧上海墙钟）语义以真实样本核验为准（P 级）。
# 仅启动时生效；禁止 Nacos 全局共享配置热翻转（FW-WEB-DSN-CR-001 RD-001-4）。
iov:
  web:
    jackson:
      date-format: epoch-millis
      zone-id: UTC
  # TSP-DSN-CR-014：FW-MYSQL UTC 治理（启动探针 + Druid 会话 UTC 初始化）。
  # 默认开启探针（true）：校验 JVM/OS 时区（-Duser.timezone=UTC、容器 TZ=UTC）、URL 参数
  # （connectionTimeZone=UTC & forceConnectionTimeZoneToSession=true & preserveInstants=true）、
  # Druid 会话初始化（SET time_zone='+00:00'）与真实连接会话；任一不满足 fail-fast 阻断启动。
  # 需要临时关闭时设 IOV_MYSQL_TIME_ENABLED=false（探针跳过，UTC 映射/会话初始化仍生效）。
  mysql:
    time:
      enabled: ${IOV_MYSQL_TIME_ENABLED:true}
  # FW-KAFKA Topic Provisioning：TSP 仅为自产的失败隔离 DLT Topic 声明创建定义；
  # vagw.device.online 由 VAGW 作为 Producer/Provisioning Owner，TSP 只消费、不重复声明。
  kafka:
    topic-provisioning:
      enabled: true

spring:
  # TSP-DSN-CR-014：Druid 会话 UTC 初始化（RD-TIME-003 等价 initSql）。
  # 与 Nacos mysql.yaml 的 spring.datasource.* 键级合并；若生产已含同名配置，以生产为准并保持一致。
  datasource:
    druid:
      connection-init-sqls:
        - SET time_zone='+00:00'
  kafka:
    topics:
      ccs.sim-status.changed: ccs.sim-status.changed
      vmd.vehicle-part-binding.changed: vmd.vehicle-part-binding.changed
      vmd.tbox-v2c-key-provisioned: vmd.tbox-v2c-key-provisioned
    consumer:
      group-id: tsp-vehicle-sim-status
      reactive-concurrency: 3

tsp:
  # 展示时区（TSP-DSN-CR-014）：面向运营/用户的展示场景（Excel 导出等后端格式化）使用的时区。
  # 存储/传输始终为 UTC（JVM UTC、DB UTC 墙钟、JSON epoch 输出 zone-id=UTC）；
  # 此配置仅决定后端展示层把 UTC 墙钟转换为哪个时区的墙钟显示（默认中国 Asia/Shanghai）。
  # JSON API（/list 等）输出 epoch 数字（绝对时刻），展示时区由前端自行转换，不受此配置影响。
  display:
    zone-id: ${TSP_DISPLAY_ZONE_ID:Asia/Shanghai}
  kafka:
    # DEVICE_ONLINE 消费者（TSP-DSN-CR-010）：独立 Consumer Group，手动 ack + Retry/DLT
    device-online:
      enabled: true
      topic: vagw.device.online
      group-id: iov-tsp-device-online
      retry:
        max-attempts: 5
        initial-backoff: 1s
        max-backoff: 30s
      dlt:
        enabled: true
        topic: ${TSP_DEVICE_ONLINE_DLT_TOPIC:tsp.device-online.dlt}
        partitions: ${TSP_DEVICE_ONLINE_DLT_PARTITIONS:6}
        replication-factor: ${TSP_DEVICE_ONLINE_DLT_REPLICATION_FACTOR:1}
    # 旧 vagw-tbox-event 链路默认关闭；CMD_ACK/FIND_VEHICLE 待 TSP-CR-011 恢复
    legacy-tbox-event:
      enabled: false
      topic: vagw-tbox-event
    # V2C 聚合成功事件消费者（TSP-DSN-CR-012）：独立 Consumer Group，手动 ack + Retry/DLT
    # 发布门禁默认关闭，仅在 VMD CR-062 生产者升级、Topic/ACL 与 E2E 就绪后开启
    tbox-v2c-key-provisioned:
      enabled: ${TSP_TBOX_V2C_ACTIVATION_ENABLED:true}
      topic: vmd.tbox-v2c-key-provisioned
      group-id: iov-tsp-tbox-v2c-key-provisioned
      concurrency: 1
      max-payload-bytes: 16384
      max-device-sn-bytes: 128
      max-future-skew: PT5M
      # 切换门禁（CR-012 §11）：v1 契约不能证明生产者已升级，
      # 启用前必须显式声明 active-producer-release，且旧语义事件已暂停/排空、旧新生产者不得混跑
      required-producer-release: VMD-CR-062
      active-producer-release: ${TSP_TBOX_V2C_ACTIVE_PRODUCER_RELEASE:VMD-CR-062}
      # 未知非空版本 fail-closed；wire/成功语义变化必须发布 v2
      supported-contract-versions:
        - '1'
        - v1
      retry:
        max-attempts: 5
        initial-backoff: 1s
        max-backoff: 30s
      dlt:
        enabled: true
        topic: ${TSP_TBOX_V2C_KEY_PROVISIONED_DLT_TOPIC:tsp.tbox-v2c-key-provisioned.dlt}
        partitions: ${TSP_TBOX_V2C_KEY_PROVISIONED_DLT_PARTITIONS:6}
        replication-factor: ${TSP_TBOX_V2C_KEY_PROVISIONED_DLT_REPLICATION_FACTOR:1}
        retention-days: ${TSP_TBOX_V2C_KEY_PROVISIONED_DLT_RETENTION_DAYS:7}
  tbox-management:
    # TBOX 后台运营查询（MPT，TSP-DSN-CR-009）：仅影响异常标签派生与查询/导出边界
    activation-timeout: PT30M
    long-offline-threshold: P30D
    export-max-rows: 10000
    default-page-size: 20
    max-page-size: 200
  device-admission:
    # 设备接入准入 PKI 吐销检查发布门禁（TSP-DSN-CR-011 §8）：默认关闭，
    # 关闭时准入 readiness 为 NOT_READY，但准入请求仍 fail-closed（不得跳过检查后 ALLOW）
    pki-revocation:
      enabled: ${TSP_DEVICE_ADMISSION_PKI_REVOCATION_ENABLED:false}

management:
  endpoint:
    health:
      group:
        # 注册激活专用健康组：仅代表 DEVICE_ONLINE 消费能力，不影响全局 readiness
        registrationActivation:
          include: deviceOnlineConsumer
        # V2C 激活专用健康组（TSP-DSN-CR-012 §9）：
        # topic/ACL + consumer group + 契约版本 + Inbox + retry/DLT 就绪度，不拖垮全局 readiness
        keyprovActivation:
          include: tboxV2cKeyProvisionedConsumer
        # 设备接入准入专用健康组（TSP-DSN-CR-011 §8）：
        # deviceAdmission 为 TSP 发布门禁，pkiRevocation 为 framework 吐销能力就绪度；
        # 两者均不得拖垮查询类能力的全局 readiness
        deviceAdmission:
          include: deviceAdmission,pkiRevocation

mybatis-plus:
  type-aliases-package: net.hwyz.iov.cloud.iov.tsp.service.infrastructure.persistence.po
